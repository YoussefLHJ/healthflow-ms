stages:
  - validate
  - test

python-validation:
  stage: validate
  image: python:3.12-slim
  script:
    - python --version
    - python -m compileall -q deid-microservice featurizer model-risque AuditFairness-microservice

python-tests:
  stage: test
  image: python:3.12-slim
  script:
    - python -m pip install --upgrade pip
    - |
      for dir in deid-microservice featurizer model-risque AuditFairness-microservice; do
        if [ -f "$dir/requirements.txt" ]; then
          python -m pip install -r "$dir/requirements.txt"
        fi
      done
    - |
      found=0
      for dir in deid-microservice featurizer model-risque AuditFairness-microservice; do
        if [ -d "$dir/tests" ]; then
          found=1
          python -m pytest -q "$dir/tests"
        fi
      done
      if [ "$found" -eq 0 ]; then
        echo "No Python test suites found; validation only."
      fi
